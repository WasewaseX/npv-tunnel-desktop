name: CI

# Runs on every push to main and every pull request:
#   master    - shared reusable workflow, limited to the checks that catch real
#               defects (build, analyzers, tests, secrets, dependency review)
#   windows   - compiles the WPF app and proves the shell actually renders
#   linux     - builds the Linux archive and runs it, including the engine
#
# The shared workflow is pinned to a commit: a moved tag must not be able to
# change what runs here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  master:
    name: master-ci
    uses: WasewaseX/master-ci/.github/workflows/master-ci.yml@53e85397bc2f1d097d1665e8976873f1adfdc439
    with:
      profile: standard
      runs_on: ubuntu-latest
      run_csharp: 'true'
      dotnet_version: '8.0.x'
      run_node: 'false'
      run_python: 'false'
      run_rust: 'false'
      run_go: 'false'
      run_java: 'false'
      run_cpp: 'false'
      run_ruby: 'false'
      run_php: 'false'
      run_docker: 'false'
      # Only the checks that catch defects. The style-scoring jobs in the
      # template are not part of this project's gate, so they are not selected.
      select: 'hygiene,secrets,docs,csharp,security,deps-review,scorecard'
      template_ref: 'v2.12.0'
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      id-token: write

  windows:
    name: Windows build + shell
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore NpvTunnel.sln

      - name: Build (Release)
        run: dotnet build NpvTunnel.sln -c Release --no-restore

      - name: Fetch the vendor sample container
        shell: pwsh
        # The same pinned upstream container as the Linux job, verified by digest before
        # it is handed to the tests, so a format change upstream shows up as a failure
        # rather than as a test that quietly skipped itself.
        run: |
          $url = 'https://raw.githubusercontent.com/masihyeganeh/npvs/3c113065a710941d1ac4d4401ec732242e4e9811/testdata/cfg.npvt'
          $path = Join-Path $env:RUNNER_TEMP 'sample.npvt'
          Invoke-WebRequest -Uri $url -OutFile $path
          $digest = (Get-FileHash -Path $path -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne '28dbb6fe183405eefec3581105621c56761019b56898092b327d2d87c622d9a6') {
            throw "Vendor sample digest mismatch: $digest"
          }
          "NPVT_REAL_SAMPLE=$path" >> $env:GITHUB_ENV

      - name: Test
        run: |
          dotnet test tests/NpvTunnel.Core.Tests/NpvTunnel.Core.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"
          dotnet test tests/NpvTunnel.Cli.Tests/NpvTunnel.Cli.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish win-x64 (framework-dependent)
        run: dotnet publish src/NpvTunnel.App/NpvTunnel.App.csproj -c Release -r win-x64 --self-contained false -o publish/smoke

      - name: Assert no invariant globalization
        shell: pwsh
        run: |
          # 1.0.0 shipped with InvariantGlobalization=true and died on the first
          # render with "Cannot find non-neutral culture related to 'en-us'".
          $cfg = 'publish/smoke/NpvTunnel.runtimeconfig.json'
          if (Test-Path $cfg) {
            $json = Get-Content $cfg -Raw
            if ($json -match 'System\.Globalization\.Invariant"\s*:\s*true') {
              throw 'Invariant globalization is enabled; WPF cannot render that way.'
            }
          }
          $props = Get-Content Directory.Build.props -Raw
          if ($props -match '<InvariantGlobalization>\s*true') {
            throw 'Directory.Build.props enables invariant globalization.'
          }

      - name: Launch the real app (--selftest)
        shell: pwsh
        run: |
          # Runs the production startup path: resources, services, view models,
          # window creation and the first render pass. Exit code 0 means the shell
          # actually starts; anything else prints the log and fails the build.
          $exe = 'publish/smoke/NpvTunnel.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest' -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            $logDir = Join-Path $env:LOCALAPPDATA 'NpvTunnel\logs'
            if (Test-Path $logDir) {
              Get-ChildItem $logDir -Filter *.log | ForEach-Object { Get-Content $_.FullName -Tail 80 }
            }
            throw "Self-test failed with exit code $($p.ExitCode)"
          }
          Write-Host 'Self-test passed: the window was created and rendered.'

      - name: Assert GUI subsystem (no console window)
        shell: pwsh
        run: |
          # PE/COFF: e_lfanew at 0x3C, Subsystem (UInt16) at PE + 0x5C.
          # 2 = WINDOWS_GUI, 3 = WINDOWS_CUI. Anything other than 2 means a
          # terminal window would flash on start, which this project forbids.
          $exe = 'publish/smoke/NpvTunnel.exe'
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $subsystem = [BitConverter]::ToUInt16($bytes, $pe + 0x5C)
          Write-Host "PE subsystem = $subsystem"
          if ($subsystem -ne 2) { throw "Expected GUI subsystem (2), got $subsystem" }

      - name: Assert no console host references
        shell: pwsh
        run: |
          $hits = Select-String -Path src/NpvTunnel.App/**/*.cs,src/NpvTunnel.App/*.cs -Pattern 'AllocConsole|pinvoke.*kernel32.*console' -ErrorAction SilentlyContinue
          if ($hits) { $hits | ForEach-Object { Write-Host $_ }; throw 'Console allocation found in the GUI project.' }

  linux:
    name: Linux build + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'

      - name: Formatting is not negotiable
        # The build already refuses warnings; this keeps the whitespace and style
        # rules in .editorconfig enforced too, so a review never has to mention them.
        run: dotnet format NpvTunnel.sln --verify-no-changes --severity warn

      - name: Fetch the vendor sample container
        shell: bash
        # A real channel container from the upstream npvs project, pinned by commit and
        # by digest. The test runs below see NPVT_REAL_SAMPLE, so the vendor format is
        # checked against a genuine file on every push and not only against the
        # sanitised fixture committed in tests/fixtures.
        run: |
          set -eu
          url="https://raw.githubusercontent.com/masihyeganeh/npvs/3c113065a710941d1ac4d4401ec732242e4e9811/testdata/cfg.npvt"
          curl -sSL --retry 3 -o "$RUNNER_TEMP/sample.npvt" "$url"
          echo "28dbb6fe183405eefec3581105621c56761019b56898092b327d2d87c622d9a6  $RUNNER_TEMP/sample.npvt" | sha256sum -c -
          echo "NPVT_REAL_SAMPLE=$RUNNER_TEMP/sample.npvt" >> "$GITHUB_ENV"

      - name: Test
        run: |
          dotnet test tests/NpvTunnel.Core.Tests/NpvTunnel.Core.Tests.csproj -c Release --logger "console;verbosity=normal"
          dotnet test tests/NpvTunnel.Cli.Tests/NpvTunnel.Cli.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Theme consistency
        shell: pwsh
        run: |
          # Both palettes must define the same keys, and every resource a view asks
          # for must exist - a StaticResource that only lives in the dark theme
          # fails on the user's machine at the moment they switch.
          ./scripts/check-themes.ps1
          # The light theme is generated; a hand edit that was never regenerated
          # would drift away from the styles and go unnoticed.
          ./scripts/make-light-theme.ps1
          git diff --exit-code -- src/NpvTunnel.App/Themes/Theme.Light.xaml

      - name: Build the release archive
        shell: pwsh
        run: ./scripts/publish-linux.ps1 -Version 1.0.0 -Runtime linux-x64 -SkipTests

      - name: Install the archive and run it
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/ship"
          tar xzf dist/NpvTunnel-1.0.0-linux-x64.tar.gz -C "$RUNNER_TEMP/ship"
          cd "$RUNNER_TEMP/ship/NpvTunnel-1.0.0-linux-x64"
          # No DOTNET_ROOT, no runtime on PATH: this is what a user's machine
          # looks like, and the archive has to work there on its own.
          env -i HOME="$RUNNER_TEMP/home" PATH=/usr/bin:/bin sh install.sh

          export HOME="$RUNNER_TEMP/home"
          unset XDG_CONFIG_HOME
          export PATH="$HOME/.local/bin:/usr/bin:/bin"

          npvtunnel where
          npvtunnel selftest
          npvtunnel selftest --emit "$RUNNER_TEMP/synthetic.npvt"
          npvtunnel import "$RUNNER_TEMP/synthetic.npvt"
          npvtunnel list
          npvtunnel check 0
          npvtunnel check 1
          npvtunnel show 0 | tee "$RUNNER_TEMP/show.txt"
          if grep -q '11111111-2222-3333-4444-555555555555' "$RUNNER_TEMP/show.txt"; then
            echo '::error::npvtunnel show printed a credential without --reveal'
            exit 1
          fi

          # The store holds live credentials from public channels, so it has to
          # arrive sealed, owner-only, with the key beside it.
          store="$HOME/.config/npvtunnel/profiles.json"
          key="$HOME/.config/npvtunnel/store.key"
          ls -la "$HOME/.config/npvtunnel"
          [ -f "$store" ] || { echo "::error::no store at $store"; exit 1; }
          [ -f "$key" ] || { echo "::error::no store key at $key"; exit 1; }
          if grep -q 'example\.com' "$store"; then
            echo '::error::the profile store is readable in the clear'
            exit 1
          fi
          echo "store mode $(stat -c '%a' "$store"), key mode $(stat -c '%a' "$key"), $(wc -c < "$store") bytes"
          echo "==> the Linux archive works with no runtime installed"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npvtunnel-linux-x64
          path: dist/*.tar.gz
          retention-days: 14
